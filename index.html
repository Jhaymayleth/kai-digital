<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Experiencias de proyecto de José Mauricio Rangel Núñez: Muiska, MineRoyal, Multitenant, Omegacomplex y AlegrIA."
    />
    <meta name="author" content="José Mauricio Rangel Núñez" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0e100f" />
    <script>
      try {
        const storedTheme = localStorage.getItem('portfolio:theme')
        const theme =
          storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          'content',
          theme === 'dark' ? '#0e100f' : '#f7f5f0',
        )
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Experiencias — José Mauricio Rangel Núñez</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
